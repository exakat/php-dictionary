[book]
title = "The PHP dictionary - 1.1.31"
authors = ["Damien Seguy"]
language = "en"

[output.html]
git-repository-url = "https://github.com/exakat/php-dictionary"
git-repository-icon = "fab-github"
additional-css = ["theme/custom.css"]
input-404 = "not-found.md"
site-url = "https://php-dictionary.readthedocs.io/en/latest/"

