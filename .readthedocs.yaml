version: 2
build:
  os: ubuntu-lts-latest
  tools:
    rust: latest
  jobs:
    install:
      - cargo install mdbook
    build:
      html:
        # /home/docs/.asdf/installs/rust/1.96.0/bin/mdbook is read from the logs of readthedocs
        - /home/docs/.asdf/installs/rust/1.96.0/bin/mdbook build docs --dest-dir $READTHEDOCS_OUTPUT/html